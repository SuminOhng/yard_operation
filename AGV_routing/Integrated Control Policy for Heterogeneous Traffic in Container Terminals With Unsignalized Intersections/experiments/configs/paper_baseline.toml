[metadata]
paper_doi = "10.1109/TITS.2025.3560067"
fidelity = "paper-method-reconstruction"

[environment]
python_version = "3.13.13"
uv_version = "0.11.16"
operating_system = "Windows"
architecture = "AMD64"
sumo_version = "1.27.1"
sumo_distribution = "eclipse-sumo-win_amd64-wheel"
sumo_data_version = "1.27.1"
traci_version = "1.27.1"
sumolib_version = "1.27.1"

[simulation]
random_seed = 1
step_length_s = 1.0 # Reconstruction default; not published by the paper.
drain_timeout_s = 3600 # Reconstruction cap after the inferred 7200 s departure horizon.

[network]
intersections = 20
directed_roads = 54
grid_rows = 4
grid_columns = 5
reported_lane_pattern = "most_roads_single_lane"
minimum_road_length_m = 45
maximum_road_length_m = 300
reconstruction_manifest = "sumo/networks/paper_grid/paper_grid.manifest.toml"

[network.reconstruction]
fidelity = "method-faithful-topology-reconstruction"
node_id_rule = "j_<row>_<column>"
lanes_per_road = 1
column_x_m = [0, 300, 600, 900, 1200]
row_y_m = [600, 400, 200, 0]
vertical_direction_rule = "bidirectional"
bidirectional_horizontal_rows = [0, 3]
eastbound_horizontal_rows = [1, 2]
source_horizontal_length_m = 300
source_vertical_length_m = 200
edge_speed_mps = 14
gate_nodes = ["j_0_1", "j_0_3"]
gate_connector_edges = 0
directed_road_count_includes_only_grid_edges = true
turn_rule = "all_legal_non_uturn"
phase_rule = "one_incoming_approach"
phase_clockwise_order = ["N", "E", "S", "W"]
bootstrap_phase_duration_s = 3600
bootstrap_phase_next_rule = "self_loop_until_traci_override"
sumo_tls_role = "virtual_traci_actuator_for_unsignalized_vtr"

[vehicles.cav]
maximum_speed_mps = 14
speed_deviation = 0

[vehicles.hdv]
minimum_maximum_speed_mps = 9
maximum_maximum_speed_mps = 12
maximum_speed_choices_mps = [9, 10, 11, 12]
maximum_speed_distribution = "uniform_discrete_balanced"
speed_deviation = 0
alternative_route_probability = 0.20
alternative_route_application = "runtime_per_intersection_only"
alternative_route_candidate_rule = "legal_destination_reachable_non_uturn_outgoing_excluding_all_shortest_ties"
alternative_route_draw_rule = "independent_uniform_per_eligible_intersection_choose_when_draw_lt_probability"
alternative_route_choice_rule = "uniform_over_stable_edge_id_sorted_candidates"
alternative_route_fallback_rule = "stable_edge_id_shortest_distance"
alternative_route_random_seed = 1
alternative_route_random_stream = "dedicated_runtime_hdv_time_then_vehicle_id"

[demand]
paper_loading_levels_vehicles_per_hour = [1600, 2000, 2400]
baseline_vehicles_per_hour = 2000
hdv_penetration = 0.10
loading_interval_s = 300
paper_hdv_od_rule = "gate_to_internal_or_internal_to_gate"
paper_cav_od_rule = "random_distinct_terminal_road_pair"

[demand.reconstruction]
departure_horizon_s = 7200 # Inferred from figure axes; not stated as a parameter.
departure_horizon_basis = "inferred_from_figure_axes_not_published_as_parameter"
aggregate_total_rounding = "decimal_half_up"
bin_quota_rule = "cumulative_floor"
departure_rule = "evenly_spaced_bin_midpoints"
departure_decimal_places = 9
strict_internal_edge_rule = "both_endpoints_are_non_gate_nodes"
hdv_quota_rule = "exact_global_decimal_half_up_then_seeded_shuffle"
hdv_category_order = [
  "gate1_inbound",
  "gate2_inbound",
  "gate1_outbound",
  "gate2_outbound",
]
hdv_category_rule = "four_globally_balanced_categories_then_seeded_shuffle"
hdv_inbound_rule = "origin_edge_leaves_gate_destination_is_strict_internal"
hdv_outbound_rule = "origin_is_strict_internal_destination_edge_enters_gate"
hdv_route_scope_rule = "full_grid_shortest_path_intermediate_gate_nodes_do_not_exit"
cav_pair_rule = "distinct_ordered_strict_internal_edges"
cav_route_scope_rule = "full_grid_shortest_path_gate_incident_edges_allowed"
pair_sampling_rule = "uniform_over_reachable_pairs"
initial_route_rule = "sumolib_shortest_distance_no_internal_edges"
static_hdv_alternative_routes = false
vehicle_depart_lane = "best"
vehicle_depart_position = "base"
vehicle_depart_speed = "max"
vehicle_arrival_position = "max"

[routing]
initial_eta_m = 500
decision_trigger_distance_m = 30.0 # Reconstruction threshold before the downstream intersection.
tie_break_rule = "stable_edge_id"
empty_road_rule = "free_flow_time"
empty_road_speed_mps = 14
speed_floor_mps = 0.1
equation_8_distance_term = "literal_remaining_distance"
equation_8_sensitivity_alternative = "upstream_lane_position"
destination_position_rule = "destination_edge_downstream_intersection"
destination_position_basis = "Paper equations use road-node coordinates; SUMO arrivalPos=max stops before the junction center."
heuristic_admissibility_check = "required_before_sumo_runs"
cumulative_distance_rule = "completed_to_intersection_plus_candidate_edge"
eta_commit_rule = "after_successful_route_mutation"
position_absolute_tolerance_m = 1e-9
cost_absolute_tolerance_m = 1e-9
pressure_absolute_tolerance_mps = 1e-12
relative_tolerance = 1e-12

[control]
execution_profile = "paper_method_fidelity"
cycle_length_s = 30.0 # Published only in Example 1.
hdv_extension_increment_s = 1.0
hdv_extension_limit_mode = "unbounded"
duration_resolution_s = 1.0
duration_quantization_rule = "positive_minimum_largest_remainder"
clearance_time_s = 0.0 # The paper does not define an all-red interval.
boundary_observation_timing = "post_step"
queue_unit = "vehicle_slots"
capacity_slot_length_m = 7.5 # Reconstruction value for compatible queue/capacity units.
queue_speed_threshold_mps = 0.1
phase_tie_break_rule = "clockwise"

[unresolved]
items = [
  "vehicles.acceleration_mps2",
  "vehicles.deceleration_mps2",
  "vehicles.length_m",
  "vehicles.minimum_gap_m",
  "vehicles.car_follow_model",
  "metrics.queue_length_definition",
  "network.original_coordinates",
  "network.original_edge_lengths",
  "network.original_gate_connectors",
  "network.original_turn_permissions",
]
