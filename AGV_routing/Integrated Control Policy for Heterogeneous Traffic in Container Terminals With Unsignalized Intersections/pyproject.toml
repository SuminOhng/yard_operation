[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "irbp-replica"
version = "0.1.0"
description = "Reproduction of BP-based VTR control and IR-BP routing for heterogeneous container-terminal traffic"
readme = "README.md"
requires-python = "==3.13.13"
dependencies = [
    "eclipse-sumo==1.27.1",
    "sumo-data==1.27.1",
    "sumolib==1.27.1",
    "traci==1.27.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "setuptools==84.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.uv]
required-version = "==0.11.16"
