[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "irbp-replica"
version = "0.1.0"
description = "Reproduction of BP-based VTR control and IR-BP routing for heterogeneous container-terminal traffic"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
